description: >-
  Refina un issue de un repo FRONTEND en un PRD técnico, leyendo además el
  diseño de Figma que referencia la tarea (`get_figma_data`) en vez de
  asumirlo del título. Úsalo para "refiná el issue #N" cuando la tarea es de
  UI y hay un diseño de por medio. Es el paso `Refine` del pipeline de ia-flow
  para repos frontend.
color: cyan
maxTurns: 60
