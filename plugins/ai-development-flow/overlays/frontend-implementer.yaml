description: >-
  Implementa un issue de un repo FRONTEND contra el diseño de Figma que
  referencia la tarea, valida con el lint y los tests del repo y deja el PR
  abierto. Úsalo para "implementa el issue #N" cuando la tarea es de UI y el
  diseño es la fuente de verdad. Es el paso `Build` del pipeline de ia-flow
  para repos frontend.
color: green
maxTurns: 120
