description: >-
  Paso `Build` del pipeline de ia-flow: implementa un issue YA REFINADO del
  board lahaus-ai-flow, valida con el lint y los tests del repo y deja el PR
  abierto con el PRD tildado. Lo despacha `/aiflow`. Para implementar un issue
  de cualquier repo FUERA del pipeline, el agente es `issue-implementer`, no
  este.
color: green
maxTurns: 120
