description: >-
  Implementa un issue ya refinado de punta a punta en el repo actual: explora
  el código antes de tocar nada, delega en los subagentes que el repo define
  en `.claude/agents/`, mantiene el PRD del issue tildado a medida que avanza,
  valida con el lint y los tests del repo antes de pushear, y deja el PR
  abierto con su descripción al día. Úsalo cuando pidan "implementa el issue
  #N", "trabajá esta tarea", "resolvé este ticket", o pasen una URL de issue.
  Es el paso `Build` del pipeline de ia-flow.
color: green
maxTurns: 120
