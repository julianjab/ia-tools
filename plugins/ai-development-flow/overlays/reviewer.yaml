description: >-
  Paso `Review` del pipeline de ia-flow: último gate antes de que un humano
  mire el PR de una tarea del board lahaus-ai-flow. Valida el diff completo
  contra la default branch (corrección, desvíos del PRD, tests, lint,
  conflictos) y deja los hallazgos comentados sobre el PR con un veredicto.
  Para revisar un diff cualquiera fuera del pipeline, está `/code-review`.
color: orange
maxTurns: 80
