description: >-
  Revisa el diff completo de una branch contra la default branch antes de que
  lo mire un humano: corrección, desvíos del PRD, tests, lint, conflictos, y
  deja los hallazgos comentados sobre el PR con un veredicto. Úsalo para
  "revisá el PR", "revisá la branch antes de mergear".
color: orange
maxTurns: 80
